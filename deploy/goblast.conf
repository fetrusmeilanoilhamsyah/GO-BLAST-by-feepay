# Rate Limiting Zone khusus GO BLAST (berawalan goblast_ agar tidak konflik)
limit_req_zone $binary_remote_addr zone=goblast_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=goblast_api:10m rate=10r/s;

# Validasi Proteksi Origin: hanya izinkan trafik dari subnet resmi Cloudflare & localhost
geo $realip_remote_addr $goblast_cf_origin {
    default 0;
    include /etc/goblast/cloudflare-geo.conf;
}

# Blok Port 80 (HTTP) - Melayani ACME Challenge Let's Encrypt & Pengalihan ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fetrusmeilanoilhamsyah.my.id;

    # Verifikasi Let's Encrypt Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Blok Port 443 (HTTPS) - Akses Aman Terenkripsi via Cloudflare
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fetrusmeilanoilhamsyah.my.id;

    # Sertifikat TLS dari Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/fetrusmeilanoilhamsyah.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fetrusmeilanoilhamsyah.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Batas ukuran payload unggahan sesuai spesifikasi sistem (6 MB)
    client_max_body_size 6m;

    # Proteksi Origin Server: Tolak koneksi langsung yang tidak melalui Cloudflare
    if ($goblast_cf_origin = 0) {
        return 403;
    }

    # Restorasi IP Klien Asli dari Cloudflare
    include /etc/goblast/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Isolasi berkas sensitif dan tersembunyi
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Proxy Utama ke Aplikasi GO BLAST di port 127.0.0.1:8090
    location / {
        limit_req zone=goblast_general burst=50 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Header identitas klien yang aman
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Menimpa header CF-Connecting-IP dengan remote_addr yang telah divalidasi oleh Nginx
        proxy_set_header CF-Connecting-IP $remote_addr;

        # Timeout proxy untuk operasi upload dan SSE/polling
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_buffering off;
    }

    # Pembatasan laju khusus untuk rute polling API worker
    location /worker/api/ {
        limit_req zone=goblast_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
