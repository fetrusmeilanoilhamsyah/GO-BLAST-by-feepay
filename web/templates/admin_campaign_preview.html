<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #e5ddd5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .bubble {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 12px;
            max-width: 90%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        .bubble::after {
            content: "";
            position: absolute;
            top: 0;
            left: -10px;
            width: 0;
            height: 0;
            border: 10px solid transparent;
            border-bottom-color: #ffffff;
            border-top: 0;
            border-left: 0;
            margin-top: 0;
            margin-left: 0;
        }
        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: #ccc;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        .text {
            white-space: pre-wrap;
            font-size: 15px;
            color: #111;
            line-height: 1.4;
        }
        .buttons {
            margin-top: 10px;
            border-top: 1px solid #ddd;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            color: #00a884;
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
        }
        .button:last-child {
            border-bottom: none;
        }
        .icon {
            margin-right: 6px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="bubble">
        {{if .ImagePath}}
        <div class="image-placeholder">
            [Gambar Terlampir]
        </div>
        {{end}}

        <div class="text">{{.Text}}</div>

        {{if .Buttons}}
        <div class="buttons">
            {{range .Buttons}}
            <div class="button">
                {{if eq .Type "url"}}
                <span class="icon">🔗</span>
                {{else if eq .Type "phone"}}
                <span class="icon">📞</span>
                {{else if eq .Type "copy"}}
                <span class="icon">📋</span>
                {{end}}
                {{.Text}}
            </div>
            {{end}}
        </div>
        {{end}}
    </div>
</body>
</html>
