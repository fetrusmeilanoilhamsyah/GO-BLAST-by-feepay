<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ call .T "campaign.preview_title" }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        body {
            font-family: var(--font-body);
            background-color: var(--wa-chat-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .bubble {
            background-color: var(--wa-bubble-bg);
            border-radius: 8px;
            padding: 12px;
            max-width: 90%;
            box-shadow: 0 1px 2px var(--wa-bubble-shadow);
            position: relative;
        }
        .bubble::after {
            content: "";
            position: absolute;
            top: 0;
            left: -10px;
            width: 0;
            height: 0;
            border: 10px solid transparent;
            border-bottom-color: var(--wa-bubble-bg);
            border-top: 0;
            border-left: 0;
            margin-top: 0;
            margin-left: 0;
        }
        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: var(--wa-placeholder-bg);
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--wa-placeholder-text);
            font-size: 14px;
        }
        .text {
            white-space: pre-wrap;
            font-size: 15px;
            color: var(--wa-bubble-text);
            line-height: 1.4;
        }
        .buttons {
            margin-top: 10px;
            border-top: 1px solid var(--wa-buttons-border);
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--wa-button-border);
            color: var(--wa-button-text);
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
        }
        .button:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="bubble">
        {{if .ImagePath}}
        <div style="margin-bottom: 8px;">
            <img src="/{{.ImagePath}}" alt="Attached Image" style="max-width: 100%; max-height: 300px; border-radius: 6px; display: block; object-fit: contain;">
        </div>
        {{end}}

        <div class="text">{{.Text}}</div>

        {{if .Buttons}}
        <div class="buttons">
            {{range .Buttons}}
            <div class="button">
                {{.Text}}
            </div>
            {{end}}
        </div>
        {{end}}
    </div>
</body>
</html>
