{{define "content"}}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Campaigns</h2>
        <a href="/admin/campaigns/new" class="btn btn-primary">Buat Campaign</a>
    </div>

    <div class="card p-3 shadow-sm bg-card">
        <div class="table-responsive">
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Mode</th>
                        <th>Dibuat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Campaigns}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>{{.Name}}</td>
                        <td>
                            <span class="badge {{if eq .Status "draf"}}bg-secondary{{else if eq .Status "berjalan"}}bg-primary{{else}}bg-success{{end}}">
                                {{.Status}}
                            </span>
                        </td>
                        <td>{{.ButtonMode}}</td>
                        <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                        <td>
                            {{if eq .Status "draf"}}
                            <a href="/admin/campaigns/{{.ID}}/edit" class="btn btn-sm btn-outline-info">Edit</a>
                            <a href="/admin/campaigns/{{.ID}}/numbers" class="btn btn-sm btn-outline-warning">Nomor</a>
                            {{else}}
                            <a href="/admin/campaigns/{{.ID}}/numbers" class="btn btn-sm btn-outline-secondary">Laporan</a>
                            {{end}}
                        </td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="6" class="text-center text-muted">Belum ada campaign</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
