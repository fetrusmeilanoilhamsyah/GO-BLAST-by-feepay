{{define "admin_nav"}}
<header style="background-color: var(--color-card); border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 100;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 10px 16px;">
        <!-- Top bar: Brand & User Controls -->
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px;">
            <!-- Brand -->
            <a href="/admin" style="display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--color-text);">
                <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.02em;">{{ call .T "app.name" }}</span>
                <span style="font-size: 11px; color: var(--color-muted); font-weight: 500;">{{ call .T "app.tagline" }}</span>
                <span class="badge badge-muted" style="font-size: 10px; margin-left: 2px;">{{ call .T "admin.role" }}</span>
            </a>

            <!-- Right: Language & Logout -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <form method="POST" action="/language" style="display: inline-flex; align-items: center; margin: 0;">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <select name="lang" onchange="this.form.submit()" style="padding: 4px 8px; border: 1px solid var(--color-border); border-radius: 6px; background-color: var(--color-input-bg); color: var(--color-input-text); font-size: 12px; cursor: pointer;">
                        <option value="id"{{if eq .Lang "id"}} selected{{end}}>ID</option>
                        <option value="en"{{if eq .Lang "en"}} selected{{end}}>EN</option>
                        <option value="zh"{{if eq .Lang "zh"}} selected{{end}}>ZH</option>
                    </select>
                </form>

                <a href="/logout" class="btn btn-secondary" style="padding: 5px 10px; font-size: 12px; color: var(--color-danger); border-color: var(--color-border); text-decoration: none; border-radius: 6px;">
                    {{ call .T "common.logout" }}
                </a>
            </div>
        </div>

        <!-- Navigation Tabs: Horizontal scrolling on mobile/Android, flex on desktop -->
        <nav style="display: flex; align-items: center; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; padding-bottom: 4px; scrollbar-width: none;">
            <a href="/admin" class="btn btn-secondary{{if eq .ActiveNav "dashboard"}} btn-primary{{end}}" style="padding: 6px 14px; font-size: 13px; text-decoration: none; border-radius: 6px; flex-shrink: 0;">
                {{ call .T "admin.dashboard" }}
            </a>
            <a href="/admin/campaigns" class="btn btn-secondary{{if eq .ActiveNav "campaigns"}} btn-primary{{end}}" style="padding: 6px 14px; font-size: 13px; text-decoration: none; border-radius: 6px; flex-shrink: 0;">
                {{ call .T "admin.campaigns" }}
            </a>
            <a href="/admin/workers" class="btn btn-secondary{{if eq .ActiveNav "workers"}} btn-primary{{end}}" style="padding: 6px 14px; font-size: 13px; text-decoration: none; border-radius: 6px; flex-shrink: 0;">
                {{ call .T "admin.workers" }}
            </a>
            <a href="/admin/withdrawals" class="btn btn-secondary{{if eq .ActiveNav "withdrawals"}} btn-primary{{end}}" style="padding: 6px 14px; font-size: 13px; text-decoration: none; border-radius: 6px; flex-shrink: 0;">
                {{ call .T "admin.withdrawals" }}
            </a>
            <a href="/admin/settings" class="btn btn-secondary{{if eq .ActiveNav "settings"}} btn-primary{{end}}" style="padding: 6px 14px; font-size: 13px; text-decoration: none; border-radius: 6px; flex-shrink: 0;">
                {{ call .T "admin.settings" }}
            </a>
        </nav>
    </div>
</header>
{{end}}
