<!DOCTYPE html>
<html lang="{{ .Lang }}"{{ if .Theme }} data-theme="{{ .Theme }}"{{ end }}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <meta name="description" content="GO BLAST by feepay - Platform pengiriman pesan WhatsApp cepat, transparan, dan terpercaya. Dapatkan penghasilan dengan menghubungkan akun WhatsApp Anda.">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="GO BLAST by feepay - Platform pengiriman pesan WhatsApp cepat, transparan, dan terpercaya.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/static/css/theme.css?v=1">
</head>
<body>
    <main id="main-content">
        {{ template "content" . }}
    </main>
    {{ block "footer" . }}
    <footer style="margin-top: 40px; padding: 20px; border-top: 1px solid var(--color-border); text-align: center; font-size: 14px; color: var(--color-muted);">
        <form method="POST" action="/theme" style="display: inline-flex; align-items: center; gap: 8px;">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
            <label for="theme-select">{{ call .T "theme.label" }}</label>
            <select id="theme-select" name="theme" style="padding: 4px 8px; border: 1px solid var(--color-border); border-radius: 4px; background-color: var(--color-input-bg); color: var(--color-input-text);">
                <option value="auto"{{ if or (eq .Theme "") (eq .Theme "auto") }} selected{{ end }}>{{ call .T "theme.auto" }}</option>
                <option value="light"{{ if eq .Theme "light" }} selected{{ end }}>{{ call .T "theme.light" }}</option>
                <option value="dark"{{ if eq .Theme "dark" }} selected{{ end }}>{{ call .T "theme.dark" }}</option>
            </select>
            <noscript>
                <button type="submit" style="padding: 4px 8px; border: 1px solid var(--color-border); border-radius: 4px; background-color: var(--color-surface-muted); color: var(--color-text); cursor: pointer;">{{ call .T "theme.choose" }}</button>
            </noscript>
        </form>
        <div style="font-size: 11px; color: var(--color-muted); margin-top: 12px; line-height: 1.4;">
            Maskot Go dirancang oleh Renée French di bawah lisensi Creative Commons Attribution 3.0 (<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer" style="color: var(--color-muted); text-decoration: underline;">CC BY 3.0</a>).
        </div>
    </footer>
    <script nonce="{{ .Nonce }}">
        (function() {
            var ts = document.getElementById('theme-select');
            if (ts) {
                ts.addEventListener('change', function() {
                    this.form.submit();
                });
            }
        })();
    </script>
    {{ end }}
</body>
</html>
