{{ define "content" }}
<div class="hero">
    <h1>{{ .AppName }} <small style="font-size: 0.5em; font-weight: normal;">{{ .AppTagline }}</small></h1>
</div>

<div class="card">
    <p>{{ .SelectLanguage }}</p>
    <ul>
        <li><a href="/?lang=id">Bahasa Indonesia</a></li>
        <li><a href="/?lang=en">English</a></li>
        <li><a href="/?lang=zh">中文</a></li>
    </ul>
    
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-bg-hero);">
        <a href="/login" style="display: inline-block; padding: 10px 20px; background-color: var(--color-primary); color: white; border-radius: 4px; text-decoration: none; margin-right: 10px; font-weight: bold;">Login</a>
        <a href="/register" style="display: inline-block; padding: 10px 20px; background-color: var(--color-bg-hero); color: white; border-radius: 4px; text-decoration: none; font-weight: bold;">Register</a>
    </div>
</div>
{{ end }}
