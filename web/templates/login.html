{{ define "content" }}
<div class="container" style="max-width: 400px; margin: 40px auto; padding: 24px; background-color: var(--color-card); border: 1px solid var(--color-border); border-radius: 10px; box-shadow: 0 1px 3px var(--color-shadow);">
    <h2 style="text-align: center; color: var(--color-text); margin-top: 0;">GO BLAST <small style="font-size: 0.5em; color: var(--color-muted);">by feepay</small></h2>
    <h3 style="text-align: center; margin-bottom: 20px; font-size: 16px;">{{ .Title }}</h3>
    
    {{ if .Error }}
    <div style="background-color: var(--color-surface-muted); color: var(--color-danger); border: 1px solid var(--color-danger); padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 13px;">
        {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        {{ if .FormToken }}<input type="hidden" name="form_token" value="{{ .FormToken }}">{{ end }}
        
        <!-- Honeypot tak terlihat untuk mendeteksi bot -->
        <div class="hp-check" aria-hidden="true" style="display:none !important; position:absolute; left:-9999px;">
            <input type="text" name="website_hp" tabindex="-1" autocomplete="off">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.login_identifier" }}</label>
            <input type="text" name="identifier" required placeholder="Username atau email" style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.password" }}</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
        </div>

        {{ if .TurnstileSiteKey }}
        <div style="margin-bottom: 15px; display: flex; justify-content: center;">
            <div class="cf-turnstile" data-sitekey="{{ .TurnstileSiteKey }}" data-action="login" data-theme="{{ if eq .Theme "dark" }}dark{{ else }}light{{ end }}"></div>
        </div>
        <script nonce="{{ .Nonce }}" src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        {{ end }}

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer;">
            {{ call .T "auth.login_btn" }}
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/register" style="color: var(--color-link); font-size: 13px;">{{ call .T "auth.to_register" }}</a>
    </div>
</div>
{{ end }}
