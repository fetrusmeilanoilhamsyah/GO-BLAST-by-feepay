{{ define "content" }}
<div class="container" style="max-width: 400px; margin: 40px auto; padding: 20px; background-color: var(--card-bg); border-radius: 8px;">
    <h2 style="text-align: center; color: var(--primary-color);">GO BLAST <small style="font-size: 0.5em; color: var(--text-muted);">by feepay</small></h2>
    <h3 style="text-align: center; margin-bottom: 20px;">{{ .Title }}</h3>
    
    {{ if .Error }}
    <div style="background-color: var(--error-color); padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
        {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">{{ call .T "auth.email" }}</label>
            <input type="email" name="email" required style="width: 100%; padding: 8px; box-sizing: border-box; background-color: var(--hero-bg); color: #fff; border: 1px solid var(--card-bg); border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">{{ call .T "auth.password" }}</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box; background-color: var(--hero-bg); color: #fff; border: 1px solid var(--card-bg); border-radius: 4px;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: var(--primary-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            {{ call .T "auth.login_btn" }}
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/register" style="color: var(--link-color);">{{ call .T "auth.to_register" }}</a>
    </div>
</div>
{{ end }}
