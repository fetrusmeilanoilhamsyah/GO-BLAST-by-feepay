{{define "content"}}
<main class="container" style="max-width: 600px; margin: 60px auto; padding: 24px; text-align: center;">
    <div class="card" style="padding: 40px 24px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-card);">
        <div style="width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: var(--color-surface-muted); display: flex; align-items: center; justify-content: center; color: var(--color-muted);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
        </div>

        <div style="margin-bottom: 12px;">
            <span class="badge badge-warning" style="font-size: 12px; padding: 4px 10px;">
                Mode Pemeliharaan
            </span>
        </div>

        <h1 style="font-size: 22px; font-weight: 800; color: var(--color-text); margin-top: 0; margin-bottom: 12px; letter-spacing: -0.02em;">
            {{ call .T "maintenance.title" }}
        </h1>

        <p style="font-size: 14px; color: var(--color-muted); line-height: 1.6; margin-bottom: 28px; max-width: 460px; margin-left: auto; margin-right: auto;">
            {{ call .T "maintenance.desc" }}
        </p>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <button type="button" onclick="location.reload()" class="btn btn-secondary" style="padding: 10px 20px; font-size: 14px; cursor: pointer;">
                {{ call .T "maintenance.refresh_btn" }}
            </button>
            {{if not .IsActive}}
            <a href="/worker" class="btn btn-primary" style="padding: 10px 20px; font-size: 14px; text-decoration: none;">
                Kembali ke Panel Pekerja
            </a>
            {{end}}
        </div>
    </div>
</main>
{{end}}
