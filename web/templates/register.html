{{ define "content" }}
<div class="container" style="max-width: 400px; margin: 40px auto; padding: 24px; background-color: var(--color-card); border: 1px solid var(--color-border); border-radius: 10px; box-shadow: 0 1px 3px var(--color-shadow);">
    <h2 style="text-align: center; color: var(--color-text); margin-top: 0;">GO BLAST <small style="font-size: 0.5em; color: var(--color-muted);">by feepay</small></h2>
    <h3 style="text-align: center; margin-bottom: 20px; font-size: 16px;">{{ .Title }}</h3>
    
    {{ if .Error }}
    <div style="background-color: var(--color-surface-muted); color: var(--color-danger); border: 1px solid var(--color-danger); padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 13px;">
        {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/register">
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.username" }} <span class="badge badge-warning" style="font-size: 10px;">{{ call .T "admin.required_label" }}</span></label>
            <input type="text" name="username" pattern="[a-z0-9_]{3,20}" minlength="3" maxlength="20" placeholder="contoh: fetrus" required style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
            <small style="color: var(--color-muted); font-size: 0.8em;">3-20 karakter (huruf kecil a-z, angka 0-9, garis bawah)</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.email" }} <span style="color: var(--color-muted); font-weight: 400;">(opsional)</span></label>
            <input type="email" name="email" placeholder="nama@email.com (boleh dikosongkan)" style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.password" }}</label>
            <input type="password" name="password" minlength="10" placeholder="Minimal 10 karakter" required style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
            <small style="color: var(--color-muted); font-size: 0.8em;">{{ call .T "auth.password_hint" }}</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "common.select_language" }}</label>
            <select name="language" style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
                <option value="id" {{ if eq .Lang "id" }}selected{{ end }}>Indonesia</option>
                <option value="en" {{ if eq .Lang "en" }}selected{{ end }}>English</option>
                <option value="zh" {{ if eq .Lang "zh" }}selected{{ end }}>中文</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500;">{{ call .T "auth.referral_code" }}</label>
            <input type="text" name="referral_code" placeholder="Kode referral (opsional)" style="width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: var(--color-input-bg); color: var(--color-input-text); border: 1px solid var(--color-border); border-radius: 6px; font-size: 14px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 13px; cursor: pointer; color: var(--color-text);">
                <input type="checkbox" name="agree_terms" value="true" required style="margin-top: 3px;">
                <span>{{ call .T "auth.agree_terms" }} <span class="badge badge-warning" style="font-size: 10px;">{{ call .T "admin.required_label" }}</span></span>
            </label>
        </div>

        <!-- Cloudflare Turnstile / Bot Protection Container Readiness -->
        <div id="cf-turnstile-container" style="margin-bottom: 15px;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer;">
            {{ call .T "auth.register_btn" }}
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/login" style="color: var(--color-link); font-size: 13px;">{{ call .T "auth.to_login" }}</a>
    </div>
</div>
{{ end }}
